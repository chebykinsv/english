<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экзамен по избранному — English</title>
<link rel="icon" href="/favicon-english.ico">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:#243247;font-family:Arial,sans-serif}
header{background:white;padding:18px max(20px,calc((100% - 900px)/2));display:flex;justify-content:space-between;align-items:center;gap:15px;box-shadow:0 2px 8px #24324710;flex-wrap:wrap}
header a{color:#2563eb;text-decoration:none}
main{max-width:900px;margin:30px auto;padding:0 16px}
h1{font-size:27px}
button{border:0;border-radius:7px;padding:10px 14px;cursor:pointer}
.primary{background:#2563eb;color:#fff;font-weight:bold}
.secondary{background:#e2e8f0;color:#334155}
.exam-card,.exam-result{background:#fff;border:1px solid #bfdbfe;border-left:4px solid #2563eb;border-radius:10px;padding:20px;margin:18px 0;box-shadow:0 2px 8px #24324708}
.exam-progress{font-size:13px;color:#64748b;margin-bottom:12px}
.exam-prompt{font-size:21px;font-weight:bold;margin:8px 0 18px}
.exam-input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:7px;font-size:17px;margin:8px 0 12px}
.exam-feedback{padding:12px;border-radius:7px;margin:12px 0;line-height:1.5}
.exam-feedback.good{background:#dcfce7;color:#166534}
.exam-feedback.bad{background:#fee2e2;color:#991b1b}
.exam-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.exam-error{padding:10px 0;border-bottom:1px solid #e2e8f0}
.exam-error:last-child{border-bottom:0}
.muted{color:#64748b;line-height:1.5}
@media(max-width:600px){.exam-prompt{font-size:18px}.exam-actions button{flex:1}}
</style>
</head>
<body>
<header>
 <a href="/favorites.html">← К избранному</a>
 <strong>📝 Экзамен по избранному</strong>
 <a href="/">К урокам</a>
</header>
<main>
 <h1>Экзамен по избранным фразам</h1>
 <p class="muted" id="status">Загружаю сохранённые фразы…</p>
 <section id="examArea" aria-live="polite"></section>
</main>
<script>
async function request(url,options={}){
 const response=await fetch(url,{credentials:'same-origin',cache:'no-store',...options});
 if(response.status===401){
  const next=location.pathname+location.search+location.hash;
  location.href='/login.html?next='+encodeURIComponent(next);
  throw new Error('Требуется вход');
 }
 if(!response.ok)throw new Error('Ошибка запроса: '+response.status);
 return response.json();
}
let favoriteItems=[];
let examItems=[];
let examIndex=0;
let examCorrect=0;
let examMistakes=[];
let examAnswered=false;

function normalizeAnswer(value){
 return String(value||'').toLowerCase().trim().replace(/[’‘]/g,"'").replace(/[.,!?;:]+$/g,'').replace(/\s+/g,' ');
}
function startExam(items){
 if(!items.length){alert('Нет фраз для экзамена.');return;}
 examItems=[...items]; examIndex=0; examCorrect=0; examMistakes=[]; examAnswered=false;
 document.getElementById('examArea').scrollIntoView({behavior:'smooth',block:'start'});
 renderExamQuestion();
}
function renderExamQuestion(){
 const area=document.getElementById('examArea');
 if(examIndex>=examItems.length){renderExamResult();return;}
 const item=examItems[examIndex]; examAnswered=false; area.replaceChildren();
 const card=document.createElement('div'); card.className='exam-card';
 const progress=document.createElement('div'); progress.className='exam-progress'; progress.textContent=`Вопрос ${examIndex+1} из ${examItems.length}`;
 const prompt=document.createElement('div'); prompt.className='exam-prompt'; prompt.textContent=item.translation;
 const label=document.createElement('label'); label.htmlFor='examAnswer'; label.textContent='Напиши перевод на английском:';
 const input=document.createElement('input'); input.className='exam-input'; input.id='examAnswer'; input.type='text'; input.autocomplete='off'; input.placeholder='Твой ответ на английском';
 const feedback=document.createElement('div'); feedback.id='examFeedback';
 const actions=document.createElement('div'); actions.className='exam-actions';
 const check=document.createElement('button'); check.className='primary'; check.textContent='Проверить';
 const next=document.createElement('button'); next.className='primary'; next.textContent=examIndex===examItems.length-1?'Завершить':'Следующая фраза'; next.hidden=true;
 check.addEventListener('click',()=>{
  if(examAnswered)return;
  if(!normalizeAnswer(input.value)){input.focus();return;}
  examAnswered=true;
  const correct=normalizeAnswer(input.value)===normalizeAnswer(item.phrase);
  feedback.className='exam-feedback '+(correct?'good':'bad');
  if(correct){examCorrect++;feedback.textContent='Верно! Отлично.';}
  else{examMistakes.push(item);feedback.textContent='Пока ошибка. Правильный ответ: '+item.phrase;}
  input.disabled=true;check.hidden=true;next.hidden=false;next.focus();
 });
 input.addEventListener('keydown',e=>{if(e.key==='Enter'){if(!examAnswered)check.click();else next.click();}});
 next.addEventListener('click',()=>{examIndex++;renderExamQuestion();});
 actions.append(check,next); card.append(progress,prompt,label,input,feedback,actions); area.append(card); input.focus();
}
function renderExamResult(){
 const area=document.getElementById('examArea'); area.replaceChildren();
 const result=document.createElement('div'); result.className='exam-result';
 const title=document.createElement('h2'); title.textContent='Экзамен завершён';
 const summary=document.createElement('p'); summary.textContent=`Результат: ${examCorrect} из ${examItems.length} · ${Math.round(examCorrect/examItems.length*100)}%`;
 result.append(title,summary);
 const retry=document.getElementById('retryErrors'); retry.hidden=!examMistakes.length; retry.textContent=`Повторить ошибки (${examMistakes.length})`;
 if(examMistakes.length){
  const heading=document.createElement('h3'); heading.textContent='Фразы, которые стоит повторить:'; result.append(heading);
  examMistakes.forEach(item=>{const line=document.createElement('div');line.className='exam-error';line.textContent=item.translation+' — '+item.phrase;result.append(line);});
 }else{const success=document.createElement('p');success.textContent='Ошибок нет. Отличная работа!';result.append(success);}
 const again=document.createElement('button');again.className='secondary';again.textContent='Пройти всё избранное ещё раз';again.addEventListener('click',()=>startExam(favoriteItems));result.append(again);area.append(result);
}
document.getElementById('startExam').addEventListener('click',()=>startExam(favoriteItems));
document.getElementById('retryErrors').addEventListener('click',()=>startExam(examMistakes));


async function initExamPage(){
 const status=document.getElementById('status');
 try{
  const data=await request('/api/favorites');
  favoriteItems=Array.isArray(data)?data:(data.favorites||[]);
  status.textContent=favoriteItems.length
   ? `Загружено фраз: ${favoriteItems.length}. Начинаем экзамен.`
   : 'Избранных фраз пока нет. Добавь фразы в уроках.';
  if(favoriteItems.length) startExam(favoriteItems);
 }catch(error){
  status.textContent=error.message;
 }
}
initExamPage();
</script>
</body>
</html>
