<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — English</title>
<link rel="icon" href="/favicon-english.ico">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;font-family:Arial,sans-serif;color:#243247;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:white;width:100%;max-width:390px;padding:30px;border-radius:16px;box-shadow:0 8px 30px #24324715}
h1{font-size:25px;margin:0 0 8px}
p{color:#718096;font-size:14px;margin-bottom:24px}
label{display:block;font-size:14px;margin:16px 0 7px}
input{width:100%;padding:13px;border:1px solid #d7dfeb;border-radius:8px;font-size:16px}
button{width:100%;padding:13px;background:#2563eb;color:white;border:0;border-radius:8px;font-size:16px;margin-top:22px;cursor:pointer}
button:disabled{opacity:.6}
#error{color:#dc2626;font-size:14px;margin-top:14px;min-height:18px}
.back{display:block;text-align:center;margin-top:20px;color:#64748b;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h1>Личный кабинет</h1>
<p>Войдите, чтобы открыть своё избранное.</p>
<form id="loginForm">
<label for="username">Логин</label>
<input id="username" value="admin" autocomplete="username" required>
<label for="password">Пароль</label>
<input id="password" type="password" autocomplete="current-password" required>
<button id="submit" type="submit">Войти</button>
<div id="error" role="alert"></div>
</form>
<a class="back" href="/">← Вернуться к урокам</a>
</div>
<script>
const form=document.getElementById('loginForm');
const error=document.getElementById('error');
form.addEventListener('submit',async e=>{
 e.preventDefault();
 const button=document.getElementById('submit');
 button.disabled=true;
 error.textContent='';
 try{
  const response=await fetch('/api/auth/login',{
   method:'POST',credentials:'same-origin',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(response.status===429?'Слишком много попыток. Попробуйте позже.':'Неверный логин или пароль.');
  sessionStorage.setItem('english_csrf',data.csrf_token);
  const params=new URLSearchParams(location.search);
  const next=params.get('next')||'/favorites.html';
  const safeNext=next.startsWith('/')&&!next.startsWith('//')?next:'/favorites.html';
  location.href=safeNext;
 }catch(err){error.textContent=err.message}
 finally{button.disabled=false}
});
</script>
</body>
</html>
