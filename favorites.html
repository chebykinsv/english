<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Избранное — English</title>
<link rel="icon" href="/favicon-english.ico">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Tahoma,sans-serif;line-height:1.55;margin:0;padding:16px;background:#f0f4f8;color:#333}
header{background:#fff;padding:14px max(20px,calc((100% - 900px)/2));display:flex;justify-content:space-between;align-items:center;gap:15px;box-shadow:0 2px 8px #24324710;flex-wrap:wrap}
header a{color:#3182ce;text-decoration:none}
main{max-width:900px;margin:22px auto;padding:0 16px}
h1{text-align:center;color:#2c3e50;margin:4px 0 8px;font-size:1.7em}
#count{color:#687386}
button{font:inherit;border:0;border-radius:7px;padding:10px 18px;cursor:pointer;font-weight:650}
.logout{background:#fee2e2;color:#991b1b}
.tabs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}
.tab{background:#cbd5e0;color:#4a5568}.tab.active,.primary{background:#3182ce;color:white}
#favoritesDirection{margin:12px 0 18px}
.card,.exam-intro,.exam-card,.exam-result{background:#fff;border-radius:10px;padding:17px;margin:15px 0;box-shadow:0 3px 8px #0000000a}
.exam-intro{border-left:6px solid #3182ce}
.exam-intro h2{margin:0 0 8px;color:#2b6cb0;font-size:1.1em}
.exam-intro p{margin:7px 0 14px;color:#687386}
.item{background:#fff;margin:0 0 12px;padding:15px 16px;border-radius:8px;box-shadow:0 2px 5px #0000000a;border-left:5px solid #38a169;overflow-wrap:anywhere}
.phrase{font-size:18px;font-weight:700;color:#2c3e50}
.translation{margin-top:8px;color:#475569;font-size:16px}
.language-label{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;color:#718096;background:#edf2f7;border-radius:4px;padding:2px 6px;margin:0 0 5px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:#687386;font-size:14px}
.meta a{color:#3182ce;text-decoration:none}
.remove,.secondary{background:#e2e8f0;color:#34415a}
.translation-toggle{margin-top:10px;background:#e2e8f0;color:#34415a;padding:8px 13px;font-size:14px}
.exam-mode{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}
.exam-mode select{font:inherit;padding:9px 12px;border:1px solid #cbd5e0;border-radius:7px;background:#fff;color:#334155}
.empty{background:#fff;padding:30px;border-radius:10px;color:#718096;text-align:center}
.progress{height:9px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin:13px 0}
.bar{height:100%;width:0;background:#3182ce;transition:width .2s}
.question{font-size:1.45em;font-weight:750;margin:16px 0;color:#2c3e50}
.answer{width:100%;padding:13px;border:1px solid #cbd5e0;border-radius:8px;font:inherit;font-size:18px}
.answer:focus{outline:2px solid #3182ce}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.feedback{display:none;padding:12px;border-radius:8px;margin-top:13px}
.feedback.good{display:block;background:#e8f6ee;color:#12683a}
.feedback.bad{display:block;background:#fff0f0;color:#9e282e}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.stat{background:#f0f4f8;padding:10px 14px;border-radius:8px}
.stat b{display:block;font-size:22px}
.exam-error{padding:10px 0;border-bottom:1px solid #e2e8f0}
.exam-error:last-child{border-bottom:0}
#examPanel[hidden],#favoritesPanel[hidden]{display:none}
@media(max-width:480px){body{padding:10px}.tab{flex:1;padding:10px 8px}.question{font-size:1.2em}}

.bulk-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;padding:12px 14px;border-radius:9px;margin:0 0 14px;box-shadow:0 2px 5px #0000000a}
.select-all{display:flex;align-items:center;gap:7px;color:#34415a;font-weight:600}
.bulk-toolbar input[type=checkbox],.favorite-check{width:18px;height:18px;accent-color:#3182ce;cursor:pointer}
#selectedCount{color:#687386;font-size:14px}
.bulk-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.remove-selected{background:#e2e8f0;color:#34415a}
.remove-all{background:#fee2e2;color:#991b1b}
.remove-selected:disabled{opacity:.45;cursor:not-allowed}
.item-head{display:flex;align-items:flex-start;gap:11px}
.item-head .phrase-wrap{flex:1;min-width:0}
.favorite-check{flex:0 0 auto;margin-top:5px}
@media(max-width:520px){.bulk-actions{width:100%;margin-left:0}.bulk-actions button{flex:1}}

</style>
</head>
<body>
<header>
<a href="/">← К урокам</a>
<strong>Моё избранное</strong>
<button class="logout" id="logout">Выйти</button>
</header>
<main>
<h1>Избранные фразы ⭐</h1>
<div id="count">Загрузка...</div>
<nav class="tabs">
 <button type="button" class="tab active" id="favoritesTab">⭐ Избранное</button>
 <button type="button" class="tab" id="examTab">📝 Экзамен</button>
</nav>
<section id="favoritesPanel">
 <div class="tabs" id="favoritesDirection">
  <button type="button" class="tab active" id="favEnRu">ENG → RU</button>
  <button type="button" class="tab" id="favRuEn">RU → ENG</button>
 </div>
 <div class="bulk-toolbar">
  <label class="select-all"><input type="checkbox" id="selectAllFavorites"> Выбрать всё</label>
  <span id="selectedCount">Выбрано: 0</span>
  <div class="bulk-actions">
   <button type="button" class="remove-selected" id="deleteSelected" disabled>Удалить выбранное</button>
   <button type="button" class="remove-all" id="deleteAll">Удалить всё</button>
  </div>
 </div>
 <div id="list"></div>
</section>
<section id="examPanel" hidden>
 <div class="card exam-intro" id="examIntro">
  <h2>Настройки экзамена</h2>
  <p>Экзамен включает все фразы из избранного. Сам список фраз во время экзамена скрыт.</p>
  <div class="exam-mode"><label for="examDirection">Направление:</label><select id="examDirection"><option value="ru-en">RU → ENG</option><option value="en-ru">ENG → RU</option></select></div>
  <div class="actions"><button class="primary" id="startExam" type="button">Начать экзамен</button></div>
 </div>
 <div class="card" id="examExercise" hidden>
  <div class="meta"><span id="examCounter"></span><span id="examScore"></span></div>
  <div class="progress"><div class="bar" id="examBar"></div></div>
  <div class="question" id="examPrompt"></div>
  <input class="answer" id="examAnswer" type="text" lang="en" spellcheck="true" autocomplete="off" placeholder="Введи перевод на английском">
  <div class="actions">
   <button class="primary" id="examCheck">Проверить</button>
   <button class="secondary" id="examSkip">Пропустить</button>
   <button class="secondary" id="examNext" hidden>Следующий вопрос</button>
  </div>
  <div class="feedback" id="examFeedback" aria-live="polite"></div>
 </div>
 <div class="card" id="examFinish" hidden>
  <h2>Экзамен завершён</h2>
  <div class="stats" id="examStats"></div>
  <div id="examMistakeList"></div>
  <div class="actions">
   <button class="primary" id="examRetry">Пройти ещё раз</button>
   <button class="secondary" id="examRetryWrong">Повторить ошибки</button>
  </div>
 </div>
</section>
</main>
<script>
const list=document.getElementById('list');
const count=document.getElementById('count');
async function csrf(){
 const response=await fetch('/api/auth/csrf',{credentials:'same-origin'});
 if(response.status===401){
  location.href='/login.html';
  throw new Error('Требуется вход');
 }
 if(!response.ok)throw new Error('Не удалось получить CSRF-токен');
 const data=await response.json();
 if(!data.csrf_token)throw new Error('Сервер не вернул CSRF-токен');
 sessionStorage.setItem('english_csrf',data.csrf_token);
 return data.csrf_token;
}

async function request(url,options={}){
 const response=await fetch(url,{credentials:'same-origin',...options});
 if(response.status===401){location.href='/login.html';throw new Error('Требуется вход')}
 if(!response.ok)throw new Error('Ошибка запроса: '+response.status);
 return response.json();
}

async function load(){
 try{
  const data=await request('/api/favorites');
  favoriteItems=data.favorites || [];
  count.textContent='Всего фраз: '+favoriteItems.length;
  renderFavorites();
 }catch(e){count.textContent=e.message}
}

function renderFavorites(){
 list.replaceChildren();
 if(!favoriteItems.length){
  list.innerHTML='<div class="empty">Пока избранных фраз нет.<br>Добавляйте их с помощью ⭐ в уроках.</div>';
  return;
 }
 for(const item of favoriteItems){
  const card=document.createElement('article');
  card.className='item';
  const checkbox=document.createElement('input');
  checkbox.type='checkbox';
  checkbox.className='favorite-check';
  checkbox.dataset.favoriteId=String(item.id);
  checkbox.setAttribute('aria-label','Выбрать фразу');
  checkbox.addEventListener('change',updateBulkControls);

  const phrase=document.createElement('div');
  phrase.className='phrase';
  const translation=document.createElement('div');
  translation.className='translation';

  const sourceLabel=document.createElement('div');
  sourceLabel.className='language-label';
  const targetLabel=document.createElement('div');
  targetLabel.className='language-label';

  if(favoritesDirection==='en-ru'){
   sourceLabel.textContent='ENGLISH';
   phrase.append(sourceLabel,document.createElement('br'),document.createTextNode(item.phrase));
   targetLabel.textContent='РУССКИЙ';
   translation.append(targetLabel,document.createElement('br'),document.createTextNode(item.translation));
  }else{
   sourceLabel.textContent='РУССКИЙ';
   phrase.append(sourceLabel,document.createElement('br'),document.createTextNode(item.translation));
   targetLabel.textContent='ENGLISH';
   translation.append(targetLabel,document.createElement('br'),document.createTextNode(item.phrase));
  }

  translation.hidden=true;
  const reveal=document.createElement('button');
  reveal.type='button';
  reveal.className='translation-toggle';
  reveal.textContent='Показать перевод';
  reveal.addEventListener('click',()=>{
   translation.hidden=!translation.hidden;
   reveal.textContent=translation.hidden?'Показать перевод':'Скрыть перевод';
  });

  const meta=document.createElement('div');
  meta.className='meta';
  const lesson=document.createElement('a');
  lesson.href=item.lesson_url;
  lesson.textContent='Урок: '+item.lesson_title;
  const remove=document.createElement('button');
  remove.className='remove';
  remove.textContent='Убрать из избранного';
  remove.addEventListener('click',async()=>{
   if(!confirm('Удалить эту фразу из избранного?'))return;
   try{
    await request('/api/favorites/'+item.id,{
     method:'DELETE',
     headers:{'X-CSRF-Token':await csrf()}
    });
    await load();
   }catch(e){alert(e.message)}
  });
  meta.append(lesson,remove);
  const phraseWrap=document.createElement('div');
  phraseWrap.className='phrase-wrap';
  phraseWrap.append(phrase,reveal,translation);
  const itemHead=document.createElement('div');
  itemHead.className='item-head';
  itemHead.append(checkbox,phraseWrap);
  card.append(itemHead,meta);
  list.append(card);
 }
}


let favoriteItems=[];
let favoritesDirection='en-ru';
let examItems=[];
let examIndex=0;
let examCorrect=0;
let examMistakes=[];
let examAnswered=false;
let examDirection='ru-en';

function showTab(tab){
 const favoritesActive=tab==='favorites';
 document.getElementById('favoritesPanel').hidden=!favoritesActive;
 document.getElementById('examPanel').hidden=favoritesActive;
 document.getElementById('favoritesTab').classList.toggle('active',favoritesActive);
 document.getElementById('examTab').classList.toggle('active',!favoritesActive);
}
document.getElementById('favoritesTab').addEventListener('click',()=>showTab('favorites'));
document.getElementById('examTab').addEventListener('click',()=>showTab('exam'));
document.getElementById('favEnRu').addEventListener('click',()=>{
 favoritesDirection='en-ru';
 document.getElementById('favEnRu').classList.add('active');
 document.getElementById('favRuEn').classList.remove('active');
 renderFavorites();
});
document.getElementById('favRuEn').addEventListener('click',()=>{
 favoritesDirection='ru-en';
 document.getElementById('favRuEn').classList.add('active');
 document.getElementById('favEnRu').classList.remove('active');
 renderFavorites();
});

function normalizeAnswer(value){
 return String(value||'').toLowerCase().trim().replace(/[’‘]/g,"'").replace(/[.,!?;:]+$/g,'').replace(/\s+/g,' ');
}
function startExam(items){
 if(!items.length){alert('В избранном пока нет фраз.');return;}
 examItems=[...items]; examIndex=0; examCorrect=0; examMistakes=[]; examAnswered=false;
 examDirection=document.getElementById('examDirection').value;
 showTab('exam');
 document.getElementById('examIntro').hidden=true;
 document.getElementById('examExercise').hidden=false;
 document.getElementById('examFinish').hidden=true;
 renderExamQuestion();
}
function renderExamQuestion(){
 const counter=document.getElementById('examCounter');
 const score=document.getElementById('examScore');
 const bar=document.getElementById('examBar');
 const prompt=document.getElementById('examPrompt');
 const input=document.getElementById('examAnswer');
 const feedback=document.getElementById('examFeedback');
 const check=document.getElementById('examCheck');
 const skip=document.getElementById('examSkip');
 const next=document.getElementById('examNext');
 const area=document.getElementById('examExercise');
 if(examIndex>=examItems.length){renderExamResult();return;}
 const item=examItems[examIndex]; examAnswered=false;
 counter.textContent=`Вопрос ${examIndex+1} из ${examItems.length}`;
 score.textContent=`Верно: ${examCorrect} · Ошибки: ${examMistakes.length}`;
 bar.style.width=`${examIndex/examItems.length*100}%`;
 prompt.textContent=examDirection==='ru-en'?item.translation:item.phrase;
 input.value=''; input.disabled=false;
 input.placeholder=examDirection==='ru-en'?'Введите перевод на английском':'Введите перевод на русском';
 check.hidden=false; skip.hidden=false; next.hidden=true;
 feedback.className='feedback'; feedback.textContent='';
 input.focus();
}
function checkExamAnswer(){
 if(examAnswered)return;
 const input=document.getElementById('examAnswer');
 if(!normalizeAnswer(input.value)){input.focus();return;}
 examAnswered=true;
 const item=examItems[examIndex];
 const expected=examDirection==='ru-en'?item.phrase:item.translation;
 const correct=normalizeAnswer(input.value)===normalizeAnswer(expected);
 input.disabled=true;
 document.getElementById('examCheck').hidden=true;
 document.getElementById('examSkip').hidden=true;
 document.getElementById('examNext').hidden=false;
 const feedback=document.getElementById('examFeedback');
 if(correct){
  examCorrect++;
  feedback.className='feedback good';
  feedback.innerHTML='Верно! <b>'+escapeExamHtml(expected)+'</b>';
 }else{
  examMistakes.push(item);
  feedback.className='feedback bad';
  feedback.innerHTML='Ошибка. Правильный ответ: <b>'+escapeExamHtml(expected)+'</b>';
 }
 document.getElementById('examScore').textContent=`Верно: ${examCorrect} · Ошибки: ${examMistakes.length}`;
 document.getElementById('examNext').focus();
}
function escapeExamHtml(value){
 return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function advanceExam(){examIndex++;renderExamQuestion();}
function skipExamQuestion(){
 examMistakes.push(examItems[examIndex]);
 advanceExam();
}
function renderExamResult(){
 document.getElementById('examExercise').hidden=true;
 document.getElementById('examFinish').hidden=false;
 document.getElementById('examBar').style.width='100%';
 const n=examItems.length;
 const percent=n?Math.round(examCorrect/n*100):0;
 document.getElementById('examStats').innerHTML=
  `<div class="stat"><b>${examCorrect}/${n}</b>Верно</div><div class="stat"><b>${examMistakes.length}</b>Ошибки</div><div class="stat"><b>${percent}%</b>Результат</div>`;
 const retryWrong=document.getElementById('examRetryWrong');
 retryWrong.disabled=!examMistakes.length;
 const mistakeList=document.getElementById('examMistakeList');
 mistakeList.replaceChildren();
 if(examMistakes.length){
  const heading=document.createElement('h3');heading.textContent='Фразы для повторения';mistakeList.append(heading);
  examMistakes.forEach(item=>{
   const row=document.createElement('div');row.className='exam-error';
   row.textContent=item.translation+' — '+item.phrase;mistakeList.append(row);
  });
 }else{
  const success=document.createElement('p');success.textContent='Ошибок нет. Отличная работа!';mistakeList.append(success);
 }
}
document.getElementById('startExam').addEventListener('click',()=>startExam(favoriteItems));
document.getElementById('examCheck').addEventListener('click',checkExamAnswer);
document.getElementById('examNext').addEventListener('click',advanceExam);
document.getElementById('examSkip').addEventListener('click',skipExamQuestion);
document.getElementById('examAnswer').addEventListener('keydown',e=>{
 if(e.key==='Enter'){e.preventDefault();if(examAnswered)advanceExam();else checkExamAnswer();}
});
document.getElementById('examRetry').addEventListener('click',()=>startExam(favoriteItems));
document.getElementById('examRetryWrong').addEventListener('click',()=>examMistakes.length&&startExam(examMistakes));

document.getElementById('logout').addEventListener('click',async()=>{
 try{
  await request('/api/auth/logout',{
   method:'POST',
   headers:{'X-CSRF-Token':await csrf()}
  });
  sessionStorage.removeItem('english_csrf');
  location.href='/login.html';
 }catch(e){
  alert('Не удалось выполнить выход: '+e.message);
 }
});

function selectedFavoriteIds(){
 return [...document.querySelectorAll('.favorite-check:checked')].map(x=>x.dataset.favoriteId);
}
function updateBulkControls(){
 const boxes=[...document.querySelectorAll('.favorite-check')];
 const selected=selectedFavoriteIds();
 const selectAll=document.getElementById('selectAllFavorites');
 selectAll.checked=boxes.length>0 && selected.length===boxes.length;
 selectAll.indeterminate=selected.length>0 && selected.length<boxes.length;
 document.getElementById('selectedCount').textContent='Выбрано: '+selected.length;
 document.getElementById('deleteSelected').disabled=selected.length===0;
}
document.getElementById('selectAllFavorites').addEventListener('change',e=>{
 document.querySelectorAll('.favorite-check').forEach(box=>box.checked=e.target.checked);
 updateBulkControls();
});
async function deleteFavoriteIds(ids){
 for(const id of ids){
  const token=await csrf();
  await request('/api/favorites/'+encodeURIComponent(id),{
   method:'DELETE',
   headers:{'X-CSRF-Token':token}
  });
 }
 await load();
}
document.getElementById('deleteSelected').addEventListener('click',async()=>{
 const ids=selectedFavoriteIds();
 if(!ids.length)return;
 if(!confirm('Удалить выбранные фразы из избранного ('+ids.length+')?'))return;
 const button=document.getElementById('deleteSelected');
 button.disabled=true;
 try{await deleteFavoriteIds(ids);}
 catch(e){alert('Не удалось удалить все выбранные фразы: '+e.message);updateBulkControls();}
});
document.getElementById('deleteAll').addEventListener('click',async()=>{
 const ids=favoriteItems.map(item=>String(item.id));
 if(!ids.length){alert('Избранное уже пустое.');return;}
 if(!confirm('Удалить ВСЕ фразы из избранного ('+ids.length+')? Это действие нельзя отменить.'))return;
 const button=document.getElementById('deleteAll');
 button.disabled=true;
 try{await deleteFavoriteIds(ids);}
 catch(e){alert('Не удалось удалить все фразы: '+e.message);}
 finally{button.disabled=false;}
});

load();
</script>
</body>
</html>
